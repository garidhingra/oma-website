<style>
:root {
  --sage: #6B8E7D;
  --sage-dark: #5F7F70;
  --cream: #F9F8F3;
  --text-dark: #1F2933;
  --text-body: #4B5563;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background-color: var(--cream);
  color: var(--text-body);
}

/* HEADER */
header {
  background-color: #F9F8F3;
  padding: 20px;
  border-bottom: 1px solid #E5E7EB;
}

header .wrap {
  max-width: 1100px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
}

.logo-wrap {
  text-decoration: none;
  color: inherit;
  font-weight: 500;
  font-size: 1rem;
}

.logo-wrap img {
  height: 38px;
}

header a {
  text-decoration: none;
  color: inherit;
}

nav a {
  margin-left: 20px;
  color: #4B5563;
}

/* CONTENT */
.container {
  max-width: 650px;
  margin: 100px auto;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 2.2rem;
  color: var(--text-dark);
  margin-bottom: 20px;
}

p {
  font-size: 1.05rem;
  margin-bottom: 18px;
  line-height: 1.7;
}

.highlight {
  color: var(--sage-dark);
  font-weight: 500;
}

.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 30px;
  background-color: var(--sage);
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: 0.3s ease;
}

.btn:hover {
  background-color: var(--sage-dark);
}

/* Mobile improvements */
@media (max-width: 768px) {

  section {
    padding: 40px 18px;
  }

  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }

  nav {
    margin-top: 10px;
  }

  nav a {
    margin-left: 10px;
    font-size: 0.9rem;
  }

  .pathway {
    padding: 25px;
  }

  .btn {
    width: 100%;
    max-width: 300px;
  }
}

.logo {
  height: 26px;
  width: auto;
  display: block;
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

z-index:999;
transition:0.3s;
}

.whatsapp-float img{
width:28px;
height:28px;
}

.whatsapp-float:hover{
transform:scale(1.08);
}
